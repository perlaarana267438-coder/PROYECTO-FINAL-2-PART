<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="fondo-rosa">

    <div class="caja-login">
        <h1>Crear Cuenta</h1>
        <p class="subtitulo">Regístrate para subir tus proyectos</p>

        <div id="mensaje" class="alerta oculto"></div>

        <form id="form-registro" class="formulario">
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="campo">
                <label for="id-itson">ID ITSON (6 dígitos)</label>
                <input type="text" id="id-itson" placeholder="Ej. 245123" minlength="6" maxlength="6" pattern="[0-9]{6}" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>

            <button type="submit" class="boton-rosa" id="btn-registrar">Registrarme</button>
        </form>

        <p class="texto-abajo">
            ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
